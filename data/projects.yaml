  - id: medical-ai-sleep-apnea
    category: publication
    title: Medical AI - Sleep Apnea Detection Using Multimodal Learning
    description: >-
      Built a classification model to diagnose obstructive sleep apnea by
      integrating head CT imaging data with patient health records. The
      multimodal learning approach achieved 95% classification accuracy.
    media:
      - type: image
        src: images/brain3.png
        alt: Medical AI sleep apnea project thumbnail

  - id: chest-disease-recognition
    category: publication
    title: Chest Disease Recognition
    description: >-
      Developed an AI system for chest disease recognition from chest X-ray
      images with auxiliary patient information, producing detailed
      radiological reports.
    media:
      - type: image
        src: images/chest.png
        alt: Chest disease recognition project thumbnail
