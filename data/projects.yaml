  - id: nerfly
    category: publication
    title: NeRFly - NeRF-driven UAV Reconstruction and Planning
    description: >-
      A NeRF-based 3D reconstruction and trajectory planning system that
      generates energy-optimal UAV flight paths validated via SITL and HITL
      testing.
