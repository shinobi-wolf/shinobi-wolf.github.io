  - id: terrappo
    category: publication
    title: TerraPPO - Robust Quadruped Simulation
    description: >-
      MuJoCo-based quadruped simulation with terrain randomization and
      PPO-trained agents to improve sim-to-real locomotion robustness.
    media:
